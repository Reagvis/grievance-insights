name: Deploy frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pilot-frontend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require deployment enablement
        env:
          PILOT_DEPLOY_ENABLED: ${{ vars.PILOT_DEPLOY_ENABLED }}
        run: |
          if [[ "$PILOT_DEPLOY_ENABLED" != "true" ]]; then
            echo "Frontend deployment is disabled. Set PILOT_DEPLOY_ENABLED=true in pilot-frontend after authentication is approved."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static frontend
        run: npm run build:pages

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134857759074:role/grievance-insights-pilot-frontend
          aws-region: ap-south-1

      - name: Upload immutable assets
        run: >-
          aws s3 sync dist/assets/ s3://grievance-insights-pilot-134857759074-frontend/assets/
          --delete
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload other static files
        run: >-
          aws s3 sync dist/ s3://grievance-insights-pilot-134857759074-frontend/
          --delete
          --exclude "assets/*"
          --exclude "index.html"
          --cache-control "public,max-age=300"

      - name: Upload entry point last
        run: >-
          aws s3 cp dist/index.html s3://grievance-insights-pilot-134857759074-frontend/index.html
          --content-type "text/html; charset=utf-8"
          --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3B0B5R1HAYD1J --paths "/*"
